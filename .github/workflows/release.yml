name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK with version
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          cp build/app/outputs/flutter-apk/app-release.apk "Capture-${VERSION}.apk"
          ls -lh Capture-*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Capture-APK
          path: Capture-*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Capture ${{ github.ref_name }}
          body: |
            Offline OCR app — extract text from images and documents, fully on-device.

            ## Download
            Grab `Capture-${{ github.ref_name }}.apk` below and install it (allow "install from unknown sources" if prompted).

            ## Build
            - Flutter ${{ '3.38.5' }}
            - Flutter build apk --release
            - Signed with debug keys (sideload install)
          files: Capture-*.apk
          fail_on_unmatched_files: true
