name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APKs (split per CPU)
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - name: Rename APKs with version
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "Capture-${VERSION}-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "Capture-${VERSION}-armv7.apk"
          ls -lh Capture-*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Capture-APK
          path: Capture-*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Capture ${{ github.ref_name }}
          body: |
            Offline OCR app — extract text from images and documents, fully on-device.

            ## Download
            Pick the APK for your phone (not sure? choose **arm64** — nearly all modern phones):

            | File | Who it's for |
            |------|--------------|
            | `Capture-${{ github.ref_name }}-arm64.apk` | Modern phones (2017+) — **start here** |
            | `Capture-${{ github.ref_name }}-armv7.apk` | Older / budget phones |

            Install: download → open → allow "install from unknown sources" if prompted.

            ## Build
            - Flutter 3.38.5
            - `flutter build apk --release --split-per-abi`
            - Signed with debug keys (sideload install)
          files: Capture-*.apk
          fail_on_unmatched_files: true
